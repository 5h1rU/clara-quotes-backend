services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quotes
      POSTGRES_USER: ${POSTGRES_USER:-quotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quotes-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d quotes"]
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.0.2
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/quotes
      POSTGRES_USER: ${POSTGRES_USER:-quotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quotes-local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      API_USERNAME: ${API_USERNAME:-reviewer}
      API_PASSWORD: ${API_PASSWORD:-local-review-only}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      INSURER_URL: ${INSURER_URL:-https://httpbin.org/status/200}
      INSURER_TIMEOUT: ${INSURER_TIMEOUT:-5s}
      DRAFT_TTL: ${DRAFT_TTL:-30m}
      DRAFT_EXPIRATION_INTERVAL: ${DRAFT_EXPIRATION_INTERVAL:-60s}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
volumes:
  postgres-data:
  kafka-data:
